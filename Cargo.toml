[package]
name = "entity-trait-system"
version = "1.1.8"
edition = "2024"
license = "MIT"
repository = "https://github.com/jagprog5/ets"
description = "An alternative to ECS"
keywords = ["ecs", "gamedev"]

[dependencies]
paste = "1.0.15"

slotmap = "1.1.1"

[dependencies.rayon]
version = "1.11"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dev-dependencies]
bincode = { version = "2.0", features = ["serde"] }
serde_json = "1.0"
ron = "0.6"

[features]

# Enable with: --features rayon
# Parallel visitors
rayon = ["dep:rayon"]

# Enable with: --features serde
# Serialization support
serde = ["dep:serde", "slotmap/serde"]
default = []

# makes the world Debug fmt printable, but all contained entities must be also
# debug
debug = []